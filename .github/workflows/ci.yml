name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, corpus, fuzz and large-file tests
        run: npm test
      - name: Tests in a time zone east of UTC
        run: npm test
        env:
          TZ: Pacific/Auckland
      - name: Tests in a time zone west of UTC with a half-hour offset
        run: npm test
        env:
          TZ: America/St_Johns
      - name: Tests from a path with spaces and non-ASCII characters
        shell: bash
        run: |
          target="$RUNNER_TEMP/ach atlas prüfung ☃"
          mkdir -p "$target"
          cp -R . "$target"
          cd "$target"
          npm test

  package:
    name: Release gate and package
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Release gate
        run: node scripts/release-gate.js --skip-tests
      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Check the package contents
        run: node scripts/check-vsix.js
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14
